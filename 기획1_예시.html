<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-AutoBell QA 프로젝트 현황</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --slide-w: 1280px;
    --slide-h: 720px;
  }

  body {
    background: #0d0d0d;
    font-family: 'Noto Sans KR', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  /* ── top bar ── */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 48px;
    background: rgba(13,13,13,0.95);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 100;
  }
  .topbar-title {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.05em;
    font-family: 'JetBrains Mono', monospace;
  }
  .slide-counter {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── slide stage ── */
  .stage {
    margin-top: 48px;
    width: 100vw;
    height: calc(100vh - 48px - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
  }

  .slide-wrapper {
    position: relative;
    width: min(var(--slide-w), 92vw);
    aspect-ratio: 16/9;
  }

  .slide {
    position: absolute;
    inset: 0;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateX(60px) scale(0.97);
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }
  .slide.prev {
    opacity: 0;
    transform: translateX(-60px) scale(0.97);
  }

  /* slide layout */
  .slide-header {
    padding: 20px 32px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .phase-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 3px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .slide-title {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
  }
  .slide-desc {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    margin-top: 3px;
    font-weight: 300;
  }
  .slide-body {
    flex: 1;
    padding: 0 32px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .slide-body img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.06);
    cursor: zoom-in;
    transition: transform 0.2s ease;
  }
  .slide-body img:hover {
    transform: scale(1.01);
  }

  /* ── nav bar ── */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 80px;
    background: rgba(13,13,13,0.97);
    border-top: 1px solid rgba(255,255,255,0.07);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 0 24px;
    z-index: 100;
    overflow-x: auto;
  }

  .nav-thumb {
    flex-shrink: 0;
    padding: 8px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    border-radius: 6px;
    transition: background 0.15s;
    position: relative;
  }
  .nav-thumb:hover { background: rgba(255,255,255,0.05); }
  .nav-thumb.active .nav-dot {
    transform: scaleX(1);
    opacity: 1;
  }
  .nav-dot {
    height: 2px;
    width: 28px;
    border-radius: 2px;
    transform: scaleX(0.4);
    opacity: 0.3;
    transition: transform 0.2s, opacity 0.2s;
  }
  .nav-label {
    font-size: 10px;
    color: rgba(255,255,255,0.35);
    font-weight: 500;
    white-space: nowrap;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.02em;
  }
  .nav-thumb.active .nav-label { color: rgba(255,255,255,0.8); }

  /* arrow btns */
  .arrow-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50%;
    background: rgba(20,20,20,0.85);
    color: rgba(255,255,255,0.6);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    z-index: 50;
  }
  .arrow-btn:hover {
    border-color: rgba(255,255,255,0.4);
    color: #fff;
    background: rgba(40,40,40,0.9);
  }
  .arrow-btn:disabled { opacity: 0.15; cursor: default; }
  #prev-btn { left: 16px; }
  #next-btn { right: 16px; }

  /* lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 200;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 95vw;
    max-height: 95vh;
    object-fit: contain;
    border-radius: 4px;
  }
  .lb-close {
    position: absolute;
    top: 20px; right: 24px;
    font-size: 28px;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    line-height: 1;
    transition: color 0.15s;
  }
  .lb-close:hover { color: #fff; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">T-AutoBell · QA 프로젝트 현황</span>
  <span class="slide-counter" id="counter">1 / 7</span>
</div>

<div class="stage">
  <div class="slide-wrapper" id="slide-wrapper">
  </div>
</div>

<button class="arrow-btn" id="prev-btn" onclick="go(-1)">&#8592;</button>
<button class="arrow-btn" id="next-btn" onclick="go(1)">&#8594;</button>

<div class="navbar" id="navbar"></div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lb-close" onclick="closeLightbox()">&#215;</span>
  <img id="lb-img" src="" alt="">
</div>

let current = 0;
const wrapper = document.getElementById("slide-wrapper");
const navbar = document.getElementById("navbar");
const counter = document.getElementById("counter");

function buildSlides() {
  slides.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "slide" + (i === 0 ? " active" : "");
    el.id = "slide-" + i;
    el.style.background = s.color;

    const phaseColor = s.accent;
    el.innerHTML = `
      <div class="slide-header">
        <div class="phase-tag" style="background:${phaseColor}22;color:${phaseColor};border:1px solid ${phaseColor}44">${s.phase}</div>
        <div>
          <div class="slide-title">${s.label}</div>
          <div class="slide-desc">${s.desc}</div>
        </div>
      </div>
      <div class="slide-body">
        <img src="data:image/png;base64,${s.b64}" alt="${s.label}" onclick="openLightbox(this.src)" />
      </div>
    `;
    wrapper.appendChild(el);

    const thumb = document.createElement("div");
    thumb.className = "nav-thumb" + (i === 0 ? " active" : "");
    thumb.id = "thumb-" + i;
    thumb.onclick = () => goTo(i);
    thumb.innerHTML = `
      <div class="nav-dot" style="background:${phaseColor}"></div>
      <span class="nav-label">${s.phase}</span>
    `;
    navbar.appendChild(thumb);
  });
}

function goTo(n) {
  const prev = document.getElementById("slide-" + current);
  const prevThumb = document.getElementById("thumb-" + current);
  prev.classList.remove("active");
  prev.classList.add(n > current ? "prev" : "");
  prevThumb.classList.remove("active");
  setTimeout(() => prev.classList.remove("prev"), 400);

  current = n;
  const next = document.getElementById("slide-" + current);
  const nextThumb = document.getElementById("thumb-" + current);
  next.classList.add("active");
  nextThumb.classList.add("active");

  counter.textContent = (current + 1) + " / " + slides.length;
  document.getElementById("prev-btn").disabled = current === 0;
  document.getElementById("next-btn").disabled = current === slides.length - 1;
}

function go(dir) {
  const next = current + dir;
  if (next >= 0 && next < slides.length) goTo(next);
}

function openLightbox(src) {
  document.getElementById("lb-img").src = src;
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "ArrowDown") go(1);
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(-1);
  if (e.key === "Escape") closeLightbox();
});

buildSlides();
document.getElementById("prev-btn").disabled = true;
</script>
