<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenClaw TC 분석</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060c14;
  --mono:'JetBrains Mono',monospace;
  --text:#e2eaf4;--muted:#6b8aad;--border:#1e3a5f;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--mono);user-select:none;}

#cv{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4}

/* top bar */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:20;height:46px;
  display:flex;align-items:center;gap:14px;padding:0 28px;
  border-bottom:1px solid rgba(30,58,95,.6);
  background:rgba(6,12,20,.9);backdrop-filter:blur(14px);
}
.badge{padding:4px 12px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.1em;white-space:nowrap;transition:all .4s}
#slide-title{font-size:12.5px;color:var(--text);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;transition:opacity .25s}

/* stage: full area between topbar and bottombar */
#stage{
  position:fixed;top:46px;bottom:56px;left:0;right:0;
  display:flex;align-items:center;justify-content:center;
  padding:40px 100px;
}

/* card wraps image at natural size */
.card{
  position:absolute;
  background:#fff;
  border-radius:10px;
  box-shadow:0 16px 90px rgba(0,0,0,.8), 0 4px 24px rgba(0,0,0,.5);
  overflow:hidden;
  opacity:0;
  transform:translateY(22px) scale(.97);
  transition:opacity .55s cubic-bezier(.22,1,.36,1), transform .55s cubic-bezier(.22,1,.36,1);
  pointer-events:none;
}
.card.active{opacity:1;transform:none;pointer-events:auto}
.card.exit-l{opacity:0;transform:translateX(-80px) scale(.95);transition:opacity .3s ease,transform .3s ease}
.card.exit-r{opacity:0;transform:translateX(80px) scale(.95);transition:opacity .3s ease,transform .3s ease}
/* image: natural size, shrink if too large, never upscale */
.card img{
  display:block;
  width:auto;
  height:auto;
  max-width:min(88vw, 1300px);
  max-height:calc(100vh - 160px);
  image-rendering:auto;
}

/* arrows */
.arrow{
  position:fixed;top:50%;transform:translateY(-50%);z-index:30;
  width:44px;height:44px;border-radius:50%;
  background:rgba(13,25,41,.8);backdrop-filter:blur(8px);
  border:1px solid rgba(30,58,95,.9);
  color:var(--muted);font-size:17px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .2s,color .2s,opacity .2s;font-family:var(--mono);
}
.arrow:hover{background:rgba(30,58,95,.95);color:var(--text)}
.arrow:disabled{opacity:.1;cursor:default;pointer-events:none}
#arr-l{left:18px}#arr-r{right:18px}

/* bottom */
#bottom{
  position:fixed;bottom:0;left:0;right:0;height:56px;
  display:flex;align-items:center;justify-content:center;gap:8px;z-index:20;
  background:linear-gradient(transparent,rgba(6,12,20,.75));
}
#dot-row{display:flex;flex-direction:row;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(42,79,122,.8);border:1px solid rgba(42,79,122,.5);cursor:pointer;transition:all .3s}
.dot.on{transform:scale(1.6);border-color:transparent}
#pg-num{font-size:11px;color:var(--muted);letter-spacing:.12em;margin-left:4px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="topbar">
  <div class="badge" id="top-badge"></div>
  <div id="slide-title"></div>
</div>
<div id="stage"></div>
<button class="arrow" id="arr-l" onclick="go(-1)">←</button>
<button class="arrow" id="arr-r" onclick="go(1)">→</button>
<div id="bottom"><div id="dot-row"></div></div>

function goTo(n,dir){
  if(n===cur||n<0||n>=total)return;
  const prev=cur;cur=n;
  const old=document.getElementById('c'+prev);
  old.classList.remove('active');

function updateUI(){
  const s=SLIDES[cur];
  const b=document.getElementById('top-badge');
  b.textContent=s.badge;
  b.style.cssText=`background:${s.badge_color}1f;color:${s.badge_color};border:1px solid ${s.badge_color}4d`;
  const t=document.getElementById('slide-title');
  t.style.opacity='0';
  setTimeout(()=>{t.textContent=s.title;t.style.opacity='1';},130);
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.classList.toggle('on',i===cur);
    d.style.background=i===cur?s.badge_color:'';
    if(i!==cur)d.style.borderColor='';
  });
  document.getElementById('arr-l').disabled=cur===0;
  document.getElementById('arr-r').disabled=cur===total-1;
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')go(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(-1);
});
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)go(dx<0?1:-1);},{passive:true});

const cv=document.getElementById('cv'),cx=cv.getContext('2d');let pts=[];
function initBg(){cv.width=innerWidth;cv.height=innerHeight;pts=Array.from({length:55},()=>{return{x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*.65+.2,sp:Math.random()*.13+.03,op:Math.random()*.14+.03}});}
function drawBg(){cx.clearRect(0,0,cv.width,cv.height);pts.forEach(p=>{cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle=`rgba(59,158,255,${p.op})`;cx.fill();p.y-=p.sp;if(p.y<-2){p.y=cv.height+2;p.x=Math.random()*innerWidth;}});requestAnimationFrame(drawBg);}
initBg();drawBg();window.addEventListener('resize',initBg);

(function(){const c=document.getElementById('c0');c.style.transition='none';c.classList.add('active');requestAnimationFrame(()=>{c.style.transition='';});updateUI();})();
</script>
</body>
</html>
